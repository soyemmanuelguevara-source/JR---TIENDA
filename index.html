  <style>
    /* Medidas en rem: respetan el tamaño de letra elegido por el usuario
       y permiten escalar todo en tablets y monitores grandes. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #141414;
      --muted: #5a4a51;
      --rose: #d4708f;
      --card: rgba(255,255,255,.94);
      --ease: cubic-bezier(.22, 1, .36, 1);
      --gutter: 1.25rem;
      --mark: 6rem;                     /* tamaño del logo */
    }

    html {
      font-size: 100%;
      -webkit-text-size-adjust: 100%;
              text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    @media (min-width: 744px) and (min-height: 1000px) { html { font-size: 112.5%; } }
    @media (min-width: 1600px) and (min-height: 900px) { html { font-size: 112.5%; } }
    @media (min-width: 2200px) and (min-height: 1200px) { html { font-size: 131.25%; } }

    a, button { touch-action: manipulation; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #f6e9ee linear-gradient(180deg, #fbf4f7 0%, #f3e1e8 100%);   /* respaldo si no hay video ni imagen */
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ══════════ VIDEO DE FONDO ══════════
       Capa 1: imagen fija (primer cuadro) → se ve al instante y es el respaldo.
       Capa 2: video, aparece con un fundido cuando realmente se reproduce.
       Capa 3: velo claro uniforme para que todo se lea. */
    .video-bg {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100vh;
      height: 100lvh;                    /* cubre aunque la barra del navegador se esconda */
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background: url("media/poster.jpg") 55% 35% / cover no-repeat;
    }
    .video-bg video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 55% 35%;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    @media (max-aspect-ratio: 4/5) {
      .video-bg { background-image: url("media/poster-movil.jpg"); background-position: center; }
      .video-bg video { object-position: center; }
    }
    .video-on .video-bg video { opacity: 1; }
    .video-bg video::-webkit-media-controls,
    .video-bg video::-webkit-media-controls-panel,
    .video-bg video::-webkit-media-controls-start-playback-button,
    .video-bg video::-webkit-media-controls-overlay-play-button {
      display: none !important;
      -webkit-appearance: none;
    }
    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(251,244,247,.72) 0%,
        rgba(251,244,247,.56) 45%,
        rgba(251,244,247,.40) 100%);
    }

    /* ══════════ PÁGINA ══════════ */
    .page {
      position: relative;
      z-index: 1;
      flex: 1 0 auto;
      width: 100%;
      max-width: 30rem;
      margin: 0 auto;
      padding: 4.5rem var(--gutter) 2.5rem;
      padding:
        max(4.5rem, calc(env(safe-area-inset-top) + 3.75rem))
        max(var(--gutter), env(safe-area-inset-right))
        2.5rem
        max(var(--gutter), env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }
    .page > .profile { margin-top: auto; }      /* centra perfil + botones en pantallas altas */
    .page > .links   { margin-bottom: auto; }   /* → los botones quedan donde llega el pulgar */

    @keyframes up { from { opacity: 0; transform: translateY(12px); } }
    .reveal { animation: up .8s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 1ms); }

    /* Compartir */
    .share {
      position: absolute;
      top: max(1rem, calc(env(safe-area-inset-top) + .5rem));
      right: max(var(--gutter), env(safe-area-inset-right));
      width: 2.75rem; height: 2.75rem;
      border: 0; border-radius: 50%;
      background: rgba(255,255,255,.72);
      color: var(--ink);
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .25s ease, transform .25s var(--ease);
    }
    .share svg { width: 1.125rem; height: 1.125rem; }
    .share:active { transform: scale(.94); }

    /* Perfil */
    .profile { text-align: center; }
    .mark {
      width: var(--mark); height: var(--mark);
      margin: 0 auto;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 10px 30px rgba(120,40,70,.12);
    }
    .mark svg { width: 100%; height: 100%; display: block; }

    .name {
      margin-top: 1.375rem;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: .24em;
      padding-left: .24em;               /* compensa el espaciado para centrar ópticamente */
      line-height: 1.2;
    }
    .name b { color: var(--rose); font-weight: 600; }

    /* El tamaño se ajusta al ancho para que corte en "…en los / 3 puntitos…" */
    .tagline {
      margin: .75rem auto 0;
      max-width: 17.5em;
      font-size: clamp(.8125rem, calc((100vw - 2.5rem) / 17.4), .9375rem);
      line-height: 1.6;
      color: var(--muted);
    }
    .tagline .ln { display: inline-block; text-wrap: balance; }
    .name, .tagline { text-shadow: 0 1px 10px rgba(255,255,255,.7); }

    /* Botones */
    .links {
      list-style: none;
      margin-top: 2.25rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    .link-card > a {
      display: grid;
      grid-template-columns: 1.75rem 1fr 1.75rem;   /* ícono · texto centrado · flecha */
      align-items: center;
      gap: .75rem;
      min-height: 3.75rem;
      padding: .75rem 1rem;
      background: var(--card);
      border-radius: .875rem;
      color: var(--ink);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -.005em;
      line-height: 1.3;
      text-align: center;
      box-shadow: 0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(120,40,70,.07);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .35s ease;
    }
    /* Botón principal (Tienda online): oscuro para que sea lo primero que se toque */
    .link-card.primary > a {
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(20,20,20,.08), 0 12px 30px rgba(20,20,20,.22);
    }
    .link-card.primary .go { color: rgba(255,255,255,.55); }
    .link-card .ico { width: 1.75rem; height: 1.75rem; display: block; }
    .link-card .label { text-wrap: balance; }
    .link-card .go {
      width: 1rem; height: 1rem;
      justify-self: end;
      color: #a8979e;
      transition: transform .35s var(--ease), color .35s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .share:hover { background: #fff; }
      .link-card > a:hover {
        transform: translateY(-2px);
        background: #fff;
        box-shadow: 0 2px 4px rgba(20,20,20,.04), 0 14px 32px rgba(120,40,70,.12);
      }
      .link-card > a:hover .go { transform: translate(2px, -2px); color: var(--ink); }
      .link-card.primary > a:hover { background: #000; box-shadow: 0 2px 4px rgba(20,20,20,.08), 0 16px 36px rgba(20,20,20,.28); }
      .link-card.primary > a:hover .go { color: #fff; }
    }
    .link-card > a:active { transform: scale(.985); transition-duration: .1s; }

    .link-card > a:focus-visible,
    .share:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* Pie */
    .site-foot {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.25rem var(--gutter) calc(1.5rem + env(safe-area-inset-bottom));
      font-size: .75rem;
      letter-spacing: .08em;
      color: var(--muted);
    }

    /* Aviso de copiado */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(2rem + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      background: var(--ink); color: #fff;
      padding: .7rem 1.25rem;
      border-radius: 999px;
      font-size: .875rem; font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .35s var(--ease);
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ══════════ AJUSTES POR DISPOSITIVO ══════════ */
    /* Celular: botones más grandes y cómodos para el pulgar */
    @media (max-width: 480px) {
      :root { --mark: 6.5rem; }
      .name { font-size: 1.375rem; margin-top: 1.5rem; }
      .links { margin-top: 2.5rem; gap: .875rem; }
      .link-card > a {
        min-height: 4rem;
        font-size: 1.0625rem;
        border-radius: 1rem;
        grid-template-columns: 2rem 1fr 2rem;
      }
      .link-card .ico { width: 2rem; height: 2rem; }
    }
    @media (max-width: 360px) {
      :root { --gutter: 1rem; --mark: 5.25rem; }
      .link-card > a { padding: .75rem .875rem; gap: .5rem; }
      .name { font-size: 1.25rem; letter-spacing: .2em; padding-left: .2em; }
      .link-card > a { font-size: 1rem; grid-template-columns: 1.75rem 1fr 1.25rem; }
      .link-card .ico { width: 1.75rem; height: 1.75rem; }
    }
    @media (max-height: 700px) and (orientation: portrait) {
      .page { padding-top: max(3.75rem, calc(env(safe-area-inset-top) + 3.25rem)); }
      :root { --mark: 5.5rem; }
      .name { margin-top: 1.125rem; }
      .links { margin-top: 1.75rem; gap: .75rem; }
      .link-card > a { min-height: 3.625rem; }
    }
    /* Celular acostado: perfil a la izquierda, botones a la derecha */
    @media (orientation: landscape) and (max-height: 500px) {
      :root { --mark: 4.5rem; }
      .page {
        max-width: 52rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        column-gap: 2.5rem;
        padding-top: max(3.75rem, calc(env(safe-area-inset-top) + 3.25rem));   /* deja libre el botón de compartir */
        padding-bottom: 1rem;
      }
      .page > .profile { margin-top: 0; }
      .page > .links { margin: 0; gap: .625rem; }
      .name { margin-top: 1rem; font-size: 1.25rem; }
      .link-card > a { min-height: 3.25rem; padding: .5rem .875rem; font-size: 1rem; border-radius: .875rem; grid-template-columns: 1.75rem 1fr 1.75rem; }
      .link-card .ico { width: 1.75rem; height: 1.75rem; }
      .site-foot { padding-top: .5rem; padding-bottom: calc(.75rem + env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .video-bg video { display: none; }
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    var root = document.documentElement;

    /* "Reducir movimiento" se lee en vivo */
    var rmq = window.matchMedia('(prefers-reduced-motion: reduce)');
    var reduce = rmq.matches;
    function onMotionPref(e) {
      reduce = e.matches;
      if (reduce) { videoStop(); return; }
      if (!videoSrc && videoAllowed()) setVideo(VIDEO[orient()]); else playVideo();
    }
    if (rmq.addEventListener) rmq.addEventListener('change', onMotionPref);
    else if (rmq.addListener) rmq.addListener(onMotionPref);

    /* iOS Safari solo aplica :active si hay un listener táctil */
    document.addEventListener('touchstart', function () {}, { passive: true });

    /* ───────── Video de fondo a prueba de fallos ─────────
       1) Siempre hay una imagen fija debajo: si el video no carga, no se nota.
       2) Pantalla vertical → recorte vertical más ligero. Si giras el celular, cambia solo.
       3) Si el navegador bloquea la reproducción automática (p. ej. iPhone en
          "Modo de bajo consumo"), el video arranca con el primer toque.
       4) Se pausa en segundo plano y se reanuda al volver (p. ej. después de abrir Instagram).
       5) Si un archivo falla, prueba el otro; si ambos fallan, queda la imagen fija.
       6) Ahorro de datos, conexión 2G o "reducir movimiento": solo imagen fija. */
    var video = document.getElementById('bgv');
    var portraitMQ = window.matchMedia('(max-aspect-ratio: 4/5)');     // igual que en el CSS
    var VIDEO  = { land: 'media/fondo.mp4',  port: 'media/fondo-movil.mp4' };
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
    var lowData = !!conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '');
    var canMp4 = !!(video && video.canPlayType && video.canPlayType('video/mp4; codecs="avc1.640028"'));
    var videoSrc = '', triedOther = false, gestureArmed = false;

    function orient() { return portraitMQ.matches ? 'port' : 'land'; }
    function videoAllowed() { return !!video && canMp4 && !reduce && !lowData; }

    function setVideo(src, keepTime) {
      var t = keepTime && video.currentTime ? video.currentTime : 0;
      videoSrc = src;
      video.src = src;
      if (t) {
        video.addEventListener('loadedmetadata', function seek() {
          video.removeEventListener('loadedmetadata', seek);
          try { video.currentTime = t % (video.duration || t + 1); } catch (e) {}
        });
      }
      playVideo();
    }
    function playVideo() {
      if (!videoAllowed() || !videoSrc) return;
      var p;
      try { p = video.play(); } catch (e) { armGesture(); return; }
      if (p && typeof p.catch === 'function') {
        p.catch(function (err) {
          if (err && err.name === 'AbortError') return;      // cambió el archivo: no es un bloqueo
          armGesture();
        });
      }
    }
    function armGesture() {                                 // reintenta con el primer toque/clic/tecla
      if (gestureArmed) return;
      gestureArmed = true;
      var evs = ['touchend', 'pointerup', 'click', 'keydown'];
      function go() {
        evs.forEach(function (n) { window.removeEventListener(n, go, true); });
        gestureArmed = false;
        playVideo();
      }
      evs.forEach(function (n) { window.addEventListener(n, go, { capture: true, passive: true }); });
    }
    function videoStop() {
      if (!video) return;
      try { video.pause(); } catch (e) {}
      root.classList.remove('video-on');
    }

    if (video) {
      video.muted = true;
      video.defaultMuted = true;
      video.addEventListener('playing', function () { root.classList.add('video-on'); });
      video.addEventListener('error', function () {
        if (!videoSrc) return;
        if (!triedOther) {
          triedOther = true;
          setVideo(videoSrc === VIDEO.land ? VIDEO.port : VIDEO.land);
        } else {
          videoSrc = '';
          videoStop();
        }
      });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { try { video.pause(); } catch (e) {} }
        else playVideo();
      });
      window.addEventListener('pageshow', playVideo);           // al volver con "atrás"
      window.addEventListener('focus', function () { if (video.paused) playVideo(); });
      var onOrient = function () {
        if (!videoAllowed() || !videoSrc || triedOther) return;
        var want = VIDEO[orient()];
        if (want !== videoSrc) setVideo(want, true);
      };
      if (portraitMQ.addEventListener) portraitMQ.addEventListener('change', onOrient);
      else if (portraitMQ.addListener) portraitMQ.addListener(onOrient);

      if (videoAllowed()) setVideo(VIDEO[orient()]);
    }

    /* ───────── Analítica (opcional) ─────────
       Envía cada clic a dataLayer (Google Tag Manager), gtag (GA4) o fbq (Meta Pixel)
       si alguno de esos scripts está instalado en la página. Si no, no hace nada. */
    function track(name, url) {
      try {
        (window.dataLayer = window.dataLayer || []).push({ event: 'link_click', link_name: name, link_url: url });
        if (typeof window.gtag === 'function') window.gtag('event', 'select_content', { content_type: 'link', item_id: name });
        if (typeof window.fbq === 'function')  window.fbq('trackCustom', 'LinkClick', { link: name });
      } catch (e) {}
    }
    document.querySelectorAll('a[data-track]').forEach(function (a) {
      a.addEventListener('click', function () { track(a.dataset.track, a.href); });
    });

    /* ───────── Compartir la página ─────────
       Menú nativo de compartir (celular/tablet). Si no existe
       (PC o navegadores dentro de Instagram/TikTok), copia el link. */
    var toast = document.getElementById('toast');
    var toastTimer;
    function notify(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    }
    function legacyCopy(text) {
      return new Promise(function (resolve, reject) {
        var t = document.createElement('textarea');
        t.value = text;
        t.setAttribute('readonly', '');
        t.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';  // 16px evita el zoom en iOS
        document.body.appendChild(t);
        t.select();
        t.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(t);
        ok ? resolve() : reject();
      });
    }
    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
      }
      return legacyCopy(text);
    }
    document.getElementById('share').addEventListener('click', function () {
      var url = location.href;
      track('share_page', url);
      if (navigator.share) {
        navigator.share({ title: document.title, url: url }).catch(function (err) {
          if (!err || err.name !== 'AbortError') copy(url).then(function () { notify('Link copiado'); }, function () { notify(url); });
        });
      } else {
        copy(url).then(function () { notify('Link copiado'); }, function () { notify(url); });
      }
    });
  })();
  </script>
